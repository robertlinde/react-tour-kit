# Going back works across screens and out of a modal: each step shows its own screen again.
appId: ${APP_ID}
name: Goes back across screens
---
# Start clean, even if an earlier run left a tour open.
- tapOn:
    id: 'rtk-close'
    optional: true
# Home also scrolls the home screen back to the top.
- tapOn:
    id: 'tab-home'
- tapOn: 'Start the tour'
- extendedWaitUntil:
    visible: 'Welcome to react-tour-kit'
    timeout: 10000
# One step at a time: Next is ignored while the tour waits for a step (one of them loads data first).
- tapOn:
    id: 'rtk-next'
- extendedWaitUntil:
    visible: 'Highlight anything'
    timeout: 10000
- tapOn:
    id: 'rtk-next'
- extendedWaitUntil:
    visible: 'Smart placement'
    timeout: 10000
- tapOn:
    id: 'rtk-next'
- extendedWaitUntil:
    visible: 'Waits for your data'
    timeout: 10000
- tapOn:
    id: 'rtk-next'
- extendedWaitUntil:
    visible: 'Horizontal lists'
    timeout: 10000
- tapOn:
    id: 'rtk-next'
- extendedWaitUntil:
    visible: 'Below the fold'
    timeout: 10000
- tapOn:
    id: 'rtk-next'
- extendedWaitUntil:
    visible: 'Across screens'
    timeout: 10000
- tapOn:
    id: 'rtk-next'
- extendedWaitUntil:
    visible: 'Long lists'
    timeout: 10000
- tapOn:
    id: 'rtk-next'
- extendedWaitUntil:
    visible: 'Modal screens'
    timeout: 10000
- tapOn:
    id: 'rtk-prev'
- extendedWaitUntil:
    visible: 'Long lists'
- tapOn:
    id: 'rtk-prev'
- extendedWaitUntil:
    visible: 'Across screens'
- tapOn:
    id: 'rtk-prev'
- extendedWaitUntil:
    visible: 'Below the fold'
- tapOn:
    id: 'rtk-prev'
- extendedWaitUntil:
    visible: 'Horizontal lists'
- tapOn:
    id: 'rtk-prev'
- extendedWaitUntil:
    visible: 'Waits for your data'
    timeout: 10000
- tapOn:
    id: 'rtk-prev'
- extendedWaitUntil:
    visible: 'Smart placement'
- tapOn:
    id: 'rtk-close'
- extendedWaitUntil:
    notVisible: 'Smart placement'
