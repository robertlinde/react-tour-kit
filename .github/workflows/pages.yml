name: Live demo

# Deploys the showcase (demos/react, `--mode showcase`) to GitHub Pages: the README's live demo.
# The CI end-to-end tests run the showcase on every pull request, so a broken demo never gets here.
on:
  push:
    branches:
      - 'main'
    paths:
      - 'src/**'
      - 'demos/react/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The root install provides the library's types; the showcase builds from its source.
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix demos/react

      - name: Build the showcase
        run: npm run build:showcase --prefix demos/react

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the showcase
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: demos/react/dist-showcase

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
