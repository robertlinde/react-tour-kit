name: CI

# Every change to main goes through a pull request (required, up to date, squash-merged), so the
# checks run on exactly what gets merged; the release workflow checks the package again itself.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------- Lint, types, unit tests, package checks --------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Check package (publint, attw)
        run: npm run check:package

      - name: Node ESM import and server render
        run: npm run smoke:node

  # -------- Component tests in a real browser, on every supported React major --------
  component:
    name: Component tests (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use React 18
        if: ${{ matrix.react == '18' }}
        run: npm install --no-save react@18.3.1 react-dom@18.3.1 @types/react@18.3.31 @types/react-dom@18.3.7

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Component tests
        run: npm run test:component

  # -------- End to end, against the packed tarball (exactly what gets published) --------
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix demos/react

      - name: Build and pack the library
        run: |
          npm run build
          npm pack
          echo "TARBALL=$PWD/$(ls robertlinde-react-tour-kit-*.tgz)" >> "$GITHUB_ENV"

      - name: Install the tarball into the demo
        run: npm install --no-save --prefix demos/react "$TARBALL"

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox webkit --with-deps

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          TOUR_KIT_FROM_PACKAGE: '1'

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            blob-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore

  # -------- React Native: a real Metro bundle of the tarball for both platforms --------
  native-smoke:
    name: React Native bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix demos/react-native

      - name: Typecheck the demo (against the library source)
        run: npx tsc --noEmit -p demos/react-native

      - name: Build and pack the library
        run: |
          npm run build
          npm pack
          echo "TARBALL=$PWD/$(ls robertlinde-react-tour-kit-*.tgz)" >> "$GITHUB_ENV"

      - name: Install the tarball into the demo
        run: npm install --no-save --prefix demos/react-native "$TARBALL"

      - name: Bundle for Android and iOS
        working-directory: demos/react-native
        run: npx expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/expo-export"
        env:
          TOUR_KIT_FROM_PACKAGE: '1'

  # -------- The version this pull request would release --------
  next-version:
    name: Next version (dry run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get next version
        id: get_next_version
        uses: thenativeweb/get-next-version@d5e0026f4595af03fe9d57acb3e589c9d42b081b # 2.8.3

      - name: Report
        run: |
          if [ "${{ steps.get_next_version.outputs.hasNextVersion }}" = "true" ]; then
            echo "Merging this would release ${{ steps.get_next_version.outputs.version }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Merging this would not release a new version." >> "$GITHUB_STEP_SUMMARY"
          fi

  # -------- Secrets --------
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug
