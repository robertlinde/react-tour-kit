name: Release

on:
  push:
    branches:
      - 'main'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Run Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'

      - name: Get next version
        id: get_next_version
        uses: thenativeweb/get-next-version@d5e0026f4595af03fe9d57acb3e589c9d42b081b # 2.8.3

      # A re-run after the GitHub release failed: the tag exists, so there is no next version, but the release is missing.
      - name: Find an unfinished release
        if: ${{ steps.get_next_version.outputs.hasNextVersion != 'true' }}
        id: unfinished
        run: |
          tag="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          if [ -n "$tag" ] && ! gh release view "$tag" > /dev/null 2>&1; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Finish the unfinished release
        if: ${{ steps.unfinished.outputs.tag != '' }}
        run: gh release create "${{ steps.unfinished.outputs.tag }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup Node.js
        if: ${{ steps.get_next_version.outputs.hasNextVersion == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        if: ${{ steps.get_next_version.outputs.hasNextVersion == 'true' }}
        run: npm ci

      - name: Set the version
        if: ${{ steps.get_next_version.outputs.hasNextVersion == 'true' }}
        run: npm version ${{ steps.get_next_version.outputs.version }} --no-git-tag-version

      - name: Build
        if: ${{ steps.get_next_version.outputs.hasNextVersion == 'true' }}
        run: npm run build

      - name: Check package
        if: ${{ steps.get_next_version.outputs.hasNextVersion == 'true' }}
        run: |
          npm run check:package
          npm run smoke:node

      # A re-run after a failed tag push must not publish the same version again, and must not tag a
      # different commit with a version that was published from another one.
      - name: Check whether this version is already published
        if: ${{ steps.get_next_version.outputs.hasNextVersion == 'true' }}
        id: published
        run: |
          version="${{ steps.get_next_version.outputs.version }}"
          if ! npm view "@robertlinde/react-tour-kit@$version" version > /dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          published_from="$(npm view "@robertlinde/react-tour-kit@$version" gitHead 2> /dev/null || true)"
          if [ "$published_from" != "$GITHUB_SHA" ]; then
            echo "::error::$version is already on npm, published from ${published_from:-an unknown commit}, not from $GITHUB_SHA. Tag that commit by hand, or release a new version."
            exit 1
          fi

          echo "exists=true" >> "$GITHUB_OUTPUT"

      # Publish first: the tag only exists once the package does.
      - name: Publish to npm
        if: ${{ steps.get_next_version.outputs.hasNextVersion == 'true' && steps.published.outputs.exists == 'false' }}
        run: npm publish --access public --provenance

      - name: Tag the release
        if: ${{ steps.get_next_version.outputs.hasNextVersion == 'true' }}
        run: |
          tag="v${{ steps.get_next_version.outputs.version }}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi

      - name: Create GitHub release
        if: ${{ steps.get_next_version.outputs.hasNextVersion == 'true' }}
        run: |
          tag="v${{ steps.get_next_version.outputs.version }}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
