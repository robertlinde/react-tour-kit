<!doctype html>
<!--
  The stage for the README's animated preview (scripts/record-demo.ts): a browser window showing the
  showcase on the brand gradient, and a pointer. The pointer lives here, above the iframe: the tour's
  dialog is in the showcase's top layer, so a pointer drawn inside the showcase would be covered.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>react-tour-kit demo stage</title>
    <style>
      :root {
        --inset: 32px;
        --bar: 36px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 50%, #7c3aed 100%);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      .window {
        position: absolute;
        inset: var(--inset);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 12px;
        background: #fff;
        box-shadow:
          0 0 0 1px rgb(15 23 42 / 0.12),
          0 24px 48px -12px rgb(15 23 42 / 0.45);
      }

      .bar {
        position: relative;
        display: flex;
        flex: none;
        align-items: center;
        gap: 8px;
        height: var(--bar);
        padding: 0 14px;
        border-bottom: 1px solid #e2e8f0;
        background: #f1f5f9;
      }

      .light {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .url {
        position: absolute;
        left: 50%;
        display: flex;
        align-items: center;
        gap: 6px;
        width: 46%;
        height: 24px;
        justify-content: center;
        border-radius: 6px;
        background: #fff;
        color: #475569;
        font-size: 12px;
        transform: translateX(-50%);
      }

      iframe {
        flex: 1;
        width: 100%;
        border: 0;
      }

      .pointer {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        width: 22px;
        height: 22px;
        /* The tip of the arrow is the pointer's hotspot. */
        margin: -1px 0 0 -3px;
        transform-origin: 3px 1px;
        pointer-events: none;
        transition: scale 0.12s;
      }

      .pointer.pressed {
        scale: 0.85;
      }

      .ripple {
        position: absolute;
        z-index: 1;
        width: 36px;
        height: 36px;
        margin: -18px 0 0 -18px;
        border: 2px solid rgb(255 255 255 / 0.95);
        border-radius: 50%;
        background: rgb(79 70 229 / 0.35);
        opacity: 0;
        pointer-events: none;
      }

      .ripple.active {
        animation: ripple 0.45s ease-out;
      }

      @keyframes ripple {
        from {
          opacity: 1;
          scale: 0.3;
        }

        to {
          opacity: 0;
          scale: 1.3;
        }
      }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="bar">
        <span class="light" style="background: #ff5f57"></span>
        <span class="light" style="background: #febc2e"></span>
        <span class="light" style="background: #28c840"></span>
        <span class="url">
          <svg width="10" height="12" viewBox="0 0 10 12" aria-hidden="true">
            <rect x="0.5" y="5" width="9" height="6.5" rx="1.5" fill="#64748b" />
            <path d="M2.5 5V3.5a2.5 2.5 0 0 1 5 0V5" fill="none" stroke="#64748b" stroke-width="1.3" />
          </svg>
          robertlinde.github.io/react-tour-kit
        </span>
      </div>
      <iframe title="Showcase"></iframe>
    </div>

    <div class="ripple"></div>
    <svg class="pointer" viewBox="0 0 22 22" aria-hidden="true">
      <path
        d="M3 1v16.5l4.4-4.1 2.9 6.7 2.9-1.3-2.8-6.6h6.1z"
        fill="#0f172a"
        stroke="#fff"
        stroke-width="1.4"
        stroke-linejoin="round"
      />
    </svg>

    <script>
      const pointer = document.querySelector('.pointer');
      const ripple = document.querySelector('.ripple');
      const position = {x: 0, y: 0};

      const parameters = new URL(location.href).searchParams;
      // The stage is laid out in CSS pixels and drawn at `scale`: the showcase inside renders at that
      // pixel density, which the screencast (always in CSS pixels) would otherwise drop.
      document.documentElement.style.zoom = parameters.get('scale') ?? '1';
      document.querySelector('iframe').src = parameters.get('src');

      function place(x, y) {
        position.x = x;
        position.y = y;
        pointer.style.translate = `${x}px ${y}px`;
      }

      // Where the pointer is from the first paint (off stage unless given).
      place(Number(parameters.get('x') ?? -100), Number(parameters.get('y') ?? -100));

      const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);

      /** Glides the pointer to (x, y), with a slight arc like a hand moving a mouse. */
      function move(x, y, duration) {
        const from = {...position};
        const start = performance.now();
        const arc = Math.min(40, Math.hypot(x - from.x, y - from.y) * 0.12);
        return new Promise((resolve) => {
          const frame = (now) => {
            const t = Math.min(1, (now - start) / duration);
            const e = ease(t);
            place(from.x + (x - from.x) * e, from.y + (y - from.y) * e - Math.sin(Math.PI * t) * arc);
            if (t < 1) {
              requestAnimationFrame(frame);
            } else {
              resolve();
            }
          };

          requestAnimationFrame(frame);
        });
      }

      /** Shows a click at the pointer. */
      function press() {
        ripple.style.translate = `${position.x}px ${position.y}px`;
        ripple.classList.remove('active');
        void ripple.offsetWidth;
        ripple.classList.add('active');
        pointer.classList.add('pressed');
        setTimeout(() => {
          pointer.classList.remove('pressed');
        }, 140);
      }

      globalThis.stage = {place, move, press};
    </script>
  </body>
</html>
